name: Build demo to gh-pages

on:
  push:
    branches: [main]
    paths-ignore: [".github/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_ORIGIN: https://astro.ermao.net
      BASE_PATH: /
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.10.0 --activate

      - name: Install and build
        run: pnpm install --frozen-lockfile && pnpm run deploy && pnpm run audit

      - name: Publish dist to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true
