name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.10.0 --activate

      - name: Enable npm trusted publishing
        run: npm install --global npm@11.18.0

      - name: Install and validate
        run: pnpm install --frozen-lockfile && pnpm validate

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node -e "const p=require('./internal/create/package.json'); if (process.env.RELEASE_TAG !== 'v' + p.version) throw new Error('Release tag must be v' + p.version)"

      - name: Configure npm registry
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Publish
        working-directory: internal/create
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG=latest
          case "$VERSION" in *-*) TAG=beta ;; esac
          npm publish --access public --tag "$TAG"
